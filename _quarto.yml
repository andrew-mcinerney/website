project:
  type: website
  output-dir: docs

website:
  title: "Andrew McInerney"
  site-url: https://andrewmcinerney.ie
  description: "Statistician and postdoctoral researcher working on interpretable neural networks, model selection, and uncertainty quantification."
  favicon: images/favicon.png
  page-navigation: true
  search: false
  open-graph: true
  twitter-card:
    creator: "@amcinerney_"

  navbar:
    logo: images/favicon.png
    logo-alt: "Andrew McInerney"
    title: "Andrew McInerney"
    collapse-below: lg
    right:
      - text: Research
        href: index.qmd#research
      - text: Publications
        href: publication/index.qmd
      - text: Talks
        href: talk/index.qmd
      - text: Software
        href: package/index.qmd
      - text: Contact
        href: contact.qmd
      - icon: github
        href: https://github.com/andrew-mcinerney
        aria-label: GitHub

  page-footer:
    left: "© 2026 Andrew McInerney"
    center: "Built with [Quarto](https://quarto.org)"
    right:
      - icon: envelope
        href: mailto:andrew.mcinerney@ul.ie
        aria-label: Email
      - icon: github
        href: https://github.com/andrew-mcinerney
        aria-label: GitHub
      - text: "ORCID"
        href: https://orcid.org/0000-0002-2348-2159
        aria-label: ORCID
      - icon: linkedin
        href: https://linkedin.com/in/andrewjmcinerney
        aria-label: LinkedIn

format:
  html:
    theme:
      light: themes/andrew-theme-light.scss
      dark: themes/andrew-theme-dark.scss
    css: styles.css
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    anchor-sections: false
    grid:
      body-width: 1100px
      margin-width: 260px

execute:
  freeze: auto
